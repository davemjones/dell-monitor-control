[package]
name = "dellctl"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ddc-hi = "0.4"
mccs = "0.1"
mccs-caps = "0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1.10.1"
