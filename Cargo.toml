[package]
name = "monitorctl"
version = "0.2.0"
edition = "2024"
description = "Control a monitor's input, brightness, and speakers from the terminal over DDC/CI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/davemjones/dell-monitor-control"
readme = "README.md"
keywords = ["monitor", "ddc", "ddc-ci", "brightness", "cli"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
# No `nvapi`: on NVIDIA GPUs it lists every monitor a second time.
ddc-hi = { version = "0.4", default-features = false, features = ["ddc-i2c", "ddc-winapi", "ddc-macos"] }
dirs = "6"
mccs = "0.1"
mccs-caps = "0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1.10.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Devices_Display",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
